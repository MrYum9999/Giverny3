   name: Build Windows VST3
   on: [push, workflow_dispatch]
   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - run: cmake -B build
         - run: cmake --build build --config Release --target Giverny3_VST3
         - uses: actions/upload-artifact@v4
           with:
             name: Giverny3-VST3
             path: build/Giverny3_artefacts/Release/VST3/
